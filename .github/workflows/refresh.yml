name: Refresh monitoring data

# The workflow refreshes the data of the dashboard every ten minutes. The
# dashboard itself polls the data file, so the page is always up to date even
# when the workflow is delayed.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the GitHub command line
        run: |
          sudo apt-get update
          sudo apt-get install -y gh
          gh --version

      - name: Refresh the data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          python scripts/refresh.py
